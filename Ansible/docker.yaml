---
- name: Docker build, scan, and push
  hosts: local
  become: yes

  vars:
    project_path: /home/ubuntu/petstore
    repo_url: "https://github.com/mybatis/jpetstore-6.git"
    docker_image: "nida334/petstore:latest"

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Ensure project directory exists
      file:
        path: "{{ project_path }}"
        state: directory
        mode: '0755'

    - name: Clone or update project from Git
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: master
        force: yes

    - name: Build Docker Image
      command: docker build -t petstore .
      args:
        chdir: "{{ project_path }}"

    - name: Tag Docker image
      command: docker tag petstore {{ docker_image }}

    - name: Scan Docker image with Trivy
      command: trivy image {{ docker_image }}
      args:
        chdir: "{{ project_path }}"
      register: trivy_scan
      ignore_errors: yes

    - name: Save Trivy scan output to file
      copy:
        content: "{{ trivy_scan.stdout | default('No scan output') }}"
        dest: "{{ project_path }}/trivy.txt"
        mode: '0644'

    - name: Log in to Docker Hub
      community.docker.docker_login:
        registry_url: https://index.docker.io/v1/
        username: "{{ DOCKER_USERNAME }}"
        password: "{{ DOCKER_PASSWORD }}"

    - name: Push Docker image
      command: docker push {{ docker_image }}

    - name: Remove existing Docker container (if any)
      command: docker rm -f petstore
      ignore_errors: yes

    - name: Run Docker container
      command: docker run -d --name petstore -p 8081:8080 {{ docker_image }}
      register: run_result
      ignore_errors: yes

    - name: Show container start result
      debug:
        msg: >-
          {% if run_result.rc == 0 %}
          ✅ Container started successfully and running on port 8081
          {% else %}
          ❌ Failed to run container: {{ run_result.stderr }}
          {% endif %}
