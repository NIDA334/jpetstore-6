---
- name: Docker build, scan, and push
  hosts: local
  become: yes

  vars:
    project_path: /home/ubuntu/petstore
    repo_url: "https://github.com/mybatis/jpetstore-6.git"   # <-- apna repo URL yahan daalna

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes   

    - name: Ensure project directory exists
      file:
        path: "{{ project_path }}"
        state: directory
        mode: '0755'

    - name: Clone or update project from Git
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: master
        force: yes

    - name: Build Docker Image
      command: docker build -t petstore .
      args:
        chdir: "{{ project_path }}"

    - name: Tag Docker image
      command: docker tag petstore zohaib56/petstore:latest 

    - name: Scan Docker image with Trivy
      command: trivy image zohaib56/petstore:latest
      args:
        chdir: "{{ project_path }}"
      register: trivy_scan
      ignore_errors: yes

    - name: Save Trivy scan output to file
      copy:
        content: "{{ trivy_scan.stdout }}"
        dest: "{{ project_path }}/trivy.txt"
      when: trivy_scan.stdout is defined

    - name: Log in to Docker Hub
      community.docker.docker_login:
        registry_url: https://index.docker.io/v1/
        username: "{{ DOCKER_USERNAME }}"
        password: "{{ DOCKER_PASSWORD }}"

    - name: Push Docker image
      command: docker push zohaib56/petstore:latest

    - name: Remove existing Docker container
      command: docker rm petstore -f || true
      ignore_errors: true
        
    - name: Run Docker container
      command: docker run -d --name petstore -p 8081:8080 zohaib56/petstore:latest
      register: run_result
      ignore_errors: yes

    - name: Log failure if the container failed to start
      debug:
        msg: "Failed to run container: {{ run_result.stderr }}"
      when: run_result.rc != 0
